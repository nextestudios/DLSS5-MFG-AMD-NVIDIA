[package]
name = "gpu-mods-app"
version = "1.4.1"
edition = "2024"
rust-version = "1.88"
description = "DLSS 5 e Multi Frame Generation (2x-6x) em qualquer jogo, para placas NVIDIA, AMD e Intel"
license = "MIT"
repository = "https://github.com/nextestudios/DLSS5-MFG-AMD-NVIDIA"

[dependencies]
eframe = "0.37.0"
native-tls = "0.2.18"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
serde_json = "1.0.154"
sevenz-rust2 = "0.24.1"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls", "json"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Registry", "Win32_Graphics_Dxgi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
strip = true

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
egui_system_font_provider = "0.37.0"
