name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Smoke test (o .exe real num Windows)
        shell: pwsh
        env:
          # Shared runner IPs hit GitHub's anonymous API limit; the app uses this token when present.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $p = Start-Process target/release/gpu-mods-app.exe -ArgumentList '--smoke-test', "$env:RUNNER_TEMP\smoke.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\smoke.txt"
          exit $p.ExitCode
      - name: Instalador e versão portátil (gera e testa)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./installer/build.ps1 -Version "$(Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)"
      - uses: actions/upload-artifact@v7
        with:
          name: DLSS5-FrameGen
          path: |
            target/release/gpu-mods-app.exe
            dist/DLSS5-FrameGen-Setup.exe

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CHANGELOG atualizado
        run: |
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qx CHANGELOG.md \
            || { echo "::error::Toda mudança precisa de uma linha em CHANGELOG.md, na seção [Unreleased]"; exit 1; }
